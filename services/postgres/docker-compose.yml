services:
  postgres:
    image: postgres:16
    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mural}
      POSTGRES_USER: ${POSTGRES_USER:-mural_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mural_user} -d ${POSTGRES_DB:-mural}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  